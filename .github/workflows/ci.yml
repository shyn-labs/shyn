name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: node scripts/check-cli-bundle.mjs
      - run: pnpm test:e2e
        env:
          SHYN_SKIP_MODEL_DOWNLOAD: "1"
      - run: pnpm eval:keyword
# eval:hybrid needs the 640MB model: run locally before every release (RELEASING.md, Plan B)
